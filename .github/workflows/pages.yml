name: Handy-Version veröffentlichen

# Legt den Inhalt von public/ auf den Branch gh-pages; GitHub Pages liefert
# ihn von dort aus. Bewusst ohne die Umgebung „github-pages": deren
# Freigabeschritt blieb beim ersten Deployment eines neuen Repos hängen.
# Hier tut es einfaches git – kein fremder Code, wie im ganzen Projekt.

on:
  push:
    branches: [ main ]
    paths:
      - "app/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: public/ auf den Branch gh-pages legen
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ein einzelner Commit ohne Historie: der Branch trägt nur die Seite.
          cd app/public
          git init -q -b gh-pages
          git add -A
          git commit -q -m "Handy-Version aus ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
