name: Android-App bauen (APK)

# Baut aus der Web-Fassung (public/) eine installierbare Android-APK.
#  - Bei jedem Push, der die App betrifft, liegt die APK unter
#    „Actions" → Lauf → Artifacts zum Herunterladen.
#  - Bei einem Tag wie v1.4.0 entsteht zusätzlich ein Release mit APK daran.
#
# Die Web-Dateien liegen nur einmal im Repo: android/app/build.gradle kopiert
# public/ vor dem Bauen in die App-Assets.

on:
  push:
    branches: [ "**" ]
    paths:
      - "app/public/**"
      - "app/android/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      # Bei einem Tag muss die App dieselbe Fassung melden wie das Release.
      # Sonst entsteht eine APK, die sich als die alte ausgibt – und schlimmer:
      # mit unverändertem versionCode verweigert Android die Installation über
      # die schon vorhandene App. Genau so ist v1.6.0 entstanden.
      - name: Fassung gegen den Tag prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' app/android/app/build.gradle)
          code=$(sed -n 's/.*versionCode *\([0-9]*\).*/\1/p' app/android/app/build.gradle)
          echo "Tag ${GITHUB_REF_NAME}, versionName ${name}, versionCode ${code}"
          if [ "v${name}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Der Tag ${GITHUB_REF_NAME} passt nicht zu versionName ${name}."
            echo "Erst die Fassungsnummern hochziehen, dann den Tag darauf setzen."
            exit 1
          fi

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: APK bauen (Debug, ohne Signatur-Schlüssel installierbar)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK umbenennen
        run: |
          mkdir -p apk
          cp app/android/app/build/outputs/apk/debug/app-debug.apk \
             "apk/Speichenrechner-${GITHUB_SHA:0:7}.apk"
          # Fürs Release zusätzlich unter festem Namen: README und
          # APK-HERUNTERLADEN.md verlinken „speichenrechner.apk“. Mit der
          # Fassung im Dateinamen ginge dieser Link bei jedem Tag ins Leere.
          cp app/android/app/build/outputs/apk/debug/app-debug.apk \
             "apk/speichenrechner.apk"
          ls -la apk

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Speichenrechner-APK
          path: apk/Speichenrechner-*.apk
          if-no-files-found: error

      # Ans Release kommt die APK unter festem Namen, dazu die Einzeldatei für
      # den Weg ohne Server. Ein Test hält app/speichenrechner-handy.html auf
      # dem Stand von app/public/, sie kann direkt aus dem Checkout mit.
      - name: Bei einem Tag zusätzlich ein Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/speichenrechner.apk
            app/speichenrechner-handy.html
          body: |
            Speichenrechner als Android-App. Die APK ist mit dem Debug-Schlüssel
            signiert – zum Installieren muss „Unbekannte Quellen" bzw.
            „Aus dieser Quelle installieren" erlaubt werden.
